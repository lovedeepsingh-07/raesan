[workspace]
resolver = "3"
members = [
  "./crates/error",
  "./crates/raesan",
  "./crates/raesan_native",
  "./crates/raesan_web",
  "./crates/web_scraper",
  "./crates/schema",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.8", features = ["macros"] }
boa_engine = "0.21.0"
chrono = "0.4.44"
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
leptos = { version = "0.8.15", default-features = false, features = ["ssr"] }
log = "0.4.29"
rand = "0.10.0"
reqwest = { version = "0.13.1", default-features = false, features = [
  "default-tls",
] }
ron = "0.12.0"
rstest = "0.26.1"
scraper = "0.25.0"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tauri = "2.10.3"
tauri-plugin-opener = "2.5.3"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = "0.6.8"
uuid = { version = "1.21.0", features = ["v4"] }

[profile.dev]
incremental = true

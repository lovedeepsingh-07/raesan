[package]
name = "raesan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
leptos = { version = "0.8.15", default-features = false, features = ["ssr"] }
log = "0.4.29"
mime_guess = "2.0.5"
ron = "0.12.0"
rust-embed = "8.11.0"
serde = "1.0.228"
tokio = { version = "1.49.0", features = ["full"] }

[workspace]
resolver = "3"
members = [
  "./crates/error",
  "./crates/raesan",
  "./crates/raesan_web",
  "./crates/schema",
  "./crates/web_scraper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ammonia = { version = "4.1.2", features = [] }
axum = { version = "0.8.8", features = ["macros"] }
boa_engine = "0.21.0"
chrono = "0.4.44"
clap = { version = "4.5.54", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.29"
once_cell = "1.21.4"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.1", default-features = false, features = [
  "default-tls",
] }
ron = "0.12.0"
rstest = "0.26.1"
scraper = "0.25.0"
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = "0.6.8"
uuid = { version = "1.21.0", features = ["v4"] }

[profile.dev]
incremental = true

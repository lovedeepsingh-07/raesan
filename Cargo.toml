[workspace]
resolver = "3"
members = [
  "./crates/error",
  "./crates/frontend",
  "./crates/raesan",
  "./crates/web_scraper",
]

[workspace.dependencies]
boa_engine = "0.21.0"
env_logger = "0.11.8"
leptos = { version = "0.8.15", default-features = false, features = ["ssr"] }
log = "0.4.29"
reqwest = { version = "0.13.1", default-features = false, features = [
  "default-tls",
] }
ron = "0.12.0"
scraper = "0.25.0"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[profile.dev]
incremental = true
